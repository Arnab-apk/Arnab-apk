name: Update Premium Profile Art

on:
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily (after GitHub's daily stats update)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/**"

permissions:
  contents: write

jobs:
  update-heatmap:
    name: Update Premium Heatmap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch contributions
        run: python scripts/fetch_contributions.py Arnab-apk

      - name: Render premium heatmap SVG
        run: python scripts/premium_heatmap.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet premium-heatmap.svg; then
            echo "No changes to premium heatmap"
          else
            git add premium-heatmap.svg data/contributions.json
            git commit -m "chore: update premium contribution heatmap [skip ci]"
            git push
            echo "✓ Updated premium contribution heatmap"
          fi

  regenerate-static:
    name: Regenerate Premium Static Assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Check for source photo
        id: check_photo
        run: |
          if [ -f "source-photo.jpg" ] || [ -f "source-photo.png" ]; then
            echo "has_photo=true" >> $GITHUB_OUTPUT
          else
            echo "has_photo=false" >> $GITHUB_OUTPUT
          fi

      - name: Prep photo (if source exists)
        if: steps.check_photo.outputs.has_photo == 'true'
        run: |
          PHOTO=$(ls source-photo.* | head -1)
          python scripts/prep_photo.py "$PHOTO"

      - name: Generate premium ASCII portrait (if prepped exists)
        if: steps.check_photo.outputs.has_photo == 'true'
        run: |
          python scripts/premium_ascii.py

      - name: Generate premium info card
        run: |
          python scripts/premium_info_card.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          CHANGED=false
          for f in premium-ascii.svg premium-info-card.svg source-prepped.png; do
            if [ -f "$f" ] && ! git diff --quiet "$f"; then
              git add "$f"
              CHANGED=true
            fi
          done

          if [ "$CHANGED" = "true" ]; then
            git commit -m "chore: regenerate premium static assets [skip ci]"
            git push
            echo "✓ Regenerated premium static assets"
          else
            echo "No changes to premium static assets"
          fi