<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1098" viewBox="0 0 520 1098" role="img" aria-label="Arnab Mandal - System Info">

  <style>
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-15px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes barGrow {
      from { width: 0; }
      to { width: var(--bar-width); }
    }
    @keyframes countUp {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .card-row {
      opacity: 0;
      animation: slideIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .stat-value {
      opacity: 0;
      animation: countUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .skill-bar-bg {
      fill: #080c14;
    }
    .skill-bar-fill {
      transform-origin: left center;
      transform: scaleX(0);
      animation: barGrow 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .title-bar {
      opacity: 0;
      animation: fadeIn 0.3s ease-out 0.05s forwards;
    }
    .divider {
      opacity: 0;
      animation: fadeIn 0.3s ease-out forwards;
    }
    .project-icon {
      animation: pulse 2s ease-in-out infinite;
    }
    .mono {
      font-family: 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', monospace;
    }
    .interactive:hover {
      cursor: pointer;
    }
  </style>

